[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vtrdinghy-evalbudget"
version = "0.1.0"
description = "按每个评测项的成本与信息量排优先级，给出配额"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vtrdinghy" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://vtrdinghy.github.io"
Repository = "https://github.com/vtrdinghy/evalbudget"
Issues = "https://github.com/vtrdinghy/evalbudget/issues"

[project.scripts]
evalbudget = "evalbudget:main"

[tool.setuptools]
py-modules = ["evalbudget"]
